name: "Setup Node.js"
description: "Setup Node.js 22 and install npm dependencies"
runs:
  using: "composite"
  steps:
    - name: Setup Node.js 22 LTS
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      run: npm ci
      shell: bash
